<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Sabha — The private hub for India's founders, owners and investors</title>
<meta name="description" content="Sabha is an application-only hub for verified founders, business owners and investors in India: a private deal room, opportunities, events and introductions by consent.">
<meta property="og:title" content="Sabha — The private hub for India's founders, owners and investors">
<meta property="og:description" content="Application-only. Verified members. Introductions by consent.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b1a4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1a4a'/%3E%3Ctext x='32' y='43' font-family='Georgia' font-size='30' font-style='italic' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1a4a; --navy2:#13266a; --navy3:#1d3487; --ink:#0c0f16; --paper:#fff; --mist:#f4f5f9; --mist2:#eceef4; --line:#e2e5ee; --line2:#cfd4e2;
  --mu:#5b6273; --di:#8a90a0; --on:#e9ecf6; --onmu:#9aa3c4; --gold:#b8934f; --ok:#2f7d55; --bad:#b4443a;
  --sans:'Inter Tight','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --ease:cubic-bezier(.2,.7,.2,1); --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--navy);color:#fff}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-weight:400;letter-spacing:-.03em;line-height:1.02}
em,.it{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px}
@media(max-width:700px){.wrap{padding:0 20px}}
.eyebrow{font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.mu{color:var(--mu)} .di{color:var(--di)} .sm{font-size:13.5px} .xs{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 22px;border-radius:var(--r);cursor:pointer;white-space:nowrap;
  font:500 14px/1 var(--sans);border:1px solid var(--navy);background:var(--navy);color:#fff;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
.btn:hover{background:var(--navy2);transform:translateY(-1px)}
.btn.white{background:#fff;color:var(--navy);border-color:#fff}
.btn.white:hover{background:var(--mist)}
.btn.line{background:transparent;color:var(--navy);border-color:var(--line2)}
.btn.line:hover{border-color:var(--navy)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ghost:hover{border-color:#fff}
.btn.s{height:36px;padding:0 14px;font-size:13px}
.btn.bad{background:transparent;color:var(--bad);border-color:rgba(180,68,58,.35)}
.btn[disabled]{opacity:.45;pointer-events:none}
.arrow{display:inline-block;transition:transform .25s var(--ease)}
a:hover .arrow,button:hover .arrow{transform:translateX(4px)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font:500 11.5px/1 var(--sans);background:var(--mist);color:var(--mu)}
.pill.n{background:#e8ecfb;color:var(--navy2)} .pill.ok{background:#e4f3ea;color:var(--ok)} .pill.bad{background:#f8e7e5;color:var(--bad)} .pill.g{background:#f6efe1;color:#86662d}
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}*{animation:none!important;scroll-behavior:auto!important}}
/* forms */
label.f{display:block;margin-bottom:22px}
label.f span{display:block;font:500 12.5px/1 var(--sans);color:var(--mu);margin-bottom:9px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;outline:none;font-size:15px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(19,38,106,.1)}
input::placeholder,textarea::placeholder{color:var(--di)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--navy) 50%),linear-gradient(135deg,var(--navy) 50%,transparent 50%);
  background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:100px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--mu);margin:6px 0 22px}
.check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--navy)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--r);
  font-size:14px;z-index:150;opacity:0;transition:.3s var(--ease);pointer-events:none;max-width:90vw;box-shadow:0 14px 40px rgba(12,15,22,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* demo ribbon */
#demobar{background:#fff7e6;border-bottom:1px solid #efdcb2;font-size:12.5px;color:#6d5320;position:relative;z-index:60}
#demobar .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;min-height:44px;padding-top:6px;padding-bottom:6px}
#demobar b{font-weight:600}
#demobar select{width:auto;font-size:12.5px;padding:5px 30px 5px 10px;border-color:#e4cf9f;background-color:#fffdf7}
#demobar .sp{margin-left:auto}
#demobar .btn{height:30px;font-size:12px;padding:0 12px;background:#fffdf7;color:#6d5320;border-color:#e4cf9f}
@media(max-width:760px){#demobar .tx{display:none}#demobar .sp{margin-left:0}}
/* public header + mega menu */
.hdr{position:absolute;left:0;right:0;z-index:40;color:#fff;transition:background .3s,color .3s}
.hdr.solid,.hdr.light{position:sticky;top:0;background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;height:76px;gap:30px}
.logo{font-family:var(--serif);font-size:27px;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:10px}
.logo i{font-style:italic}
.mainnav{display:flex;gap:6px;margin-left:auto}
.mainnav>button,.mainnav>a{background:none;border:0;cursor:pointer;padding:10px 16px;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;color:inherit;border-radius:var(--r)}
.mainnav>button:after{content:"↓";font-size:12px;opacity:.8;transition:transform .25s}
.mainnav>button[aria-expanded=true]:after{transform:rotate(180deg)}
.hdr .portal{margin-left:14px}
.hdr:not(.solid):not(.light) .portal{background:#fff;color:var(--navy);border-color:#fff}
@media(max-width:900px){.mainnav>button,.mainnav>a.hide-m{display:none}}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--navy);color:#fff;padding:44px 0 50px;display:none;box-shadow:0 30px 60px rgba(5,10,30,.35)}
.mega.on{display:block;animation:drop .35s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.mega .wrap{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:50px;height:auto;align-items:start}
.mega h4{font-family:var(--serif);font-style:italic;font-weight:400;font-size:40px;line-height:1.05}
.mega p{color:var(--onmu);font-size:14px;margin-top:12px;max-width:340px}
.mega ul{list-style:none}
.mega li a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:17px}
.mega li a small{color:var(--onmu);font-size:13px}
.mega li a:hover{color:#cdd6ff}
/* hero */
.hero{position:relative;min-height:min(860px,96vh);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--navy)}
.hero .bg{position:absolute;inset:0}
.hero .bg svg{width:100%;height:100%;display:block}
.hero .bg.photo{background-size:cover;background-position:center}
.hero .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,36,.72) 0%,rgba(6,12,36,.35) 55%,rgba(6,12,36,.1) 100%),linear-gradient(180deg,rgba(6,12,36,.2) 0%,rgba(6,12,36,0) 45%,rgba(6,12,36,.65) 100%)}
.hero .wrap{position:relative;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:40px;padding-bottom:56px}
.hero h1{font-size:clamp(54px,8.2vw,126px);max-width:900px}
.hero p{font-size:16.5px;max-width:390px;margin-top:22px;color:#dfe4f5}
.hero .side{width:300px;flex:none}
.hero .side .hcard{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:var(--r);padding:20px;margin-bottom:12px}
.hero .side .hcard b{display:block;font-weight:500;font-size:15px;margin-bottom:4px}
.hero .side .hcard span{font-size:13px;color:#cfd6ee}
.hero .side .btn{width:100%}
@media(max-width:900px){.hero .wrap{flex-direction:column;align-items:flex-start}.hero .side{width:100%}}
/* sections */
.sec{padding:150px 0}
@media(max-width:800px){.sec{padding:90px 0}}
.statement{text-align:center}
.statement h2{font-size:clamp(36px,5vw,70px);max-width:1080px;margin:26px auto 0}
.statement p{max-width:560px;margin:28px auto 0;color:var(--mu);font-size:17px}
.stats{background:var(--navy);color:#fff}
.stats .grid{display:grid;grid-template-columns:repeat(3,1fr)}
.stats .grid>div{padding:70px 40px;border-left:1px solid rgba(255,255,255,.12);border-top:1px solid rgba(255,255,255,.12)}
.stats .grid>div:nth-child(3n+1){border-left:0}
.stats .grid>div:nth-child(-n+3){border-top:0}
.stats b{display:block;font-weight:300;font-size:clamp(46px,5vw,76px);letter-spacing:-.04em;line-height:1}
.stats span{display:block;margin-top:14px;color:var(--onmu);font-size:14.5px}
@media(max-width:800px){.stats .grid{grid-template-columns:1fr 1fr}.stats .grid>div{padding:44px 20px;border-left:1px solid rgba(255,255,255,.12)!important;border-top:1px solid rgba(255,255,255,.12)!important}.stats .grid>div:nth-child(odd){border-left:0!important}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:28px}}
.sec h2.big{font-size:clamp(44px,5.6vw,84px)}
.lead{color:var(--mu);font-size:17px;max-width:460px}
.rail-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;margin-bottom:50px;flex-wrap:wrap}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{scroll-snap-align:start;background:var(--mist);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-height:460px;transition:transform .35s var(--ease)}
.card:hover{transform:translateY(-4px)}
.card .art{height:250px;background:var(--navy);position:relative;overflow:hidden}
.card .art svg{position:absolute;inset:0;width:100%;height:100%}
.card .txt{padding:26px;flex:1;display:flex;flex-direction:column}
.card h3{font-size:30px}
.card p{color:var(--mu);font-size:14.5px;margin-top:10px;flex:1}
.card .go{margin-top:20px;font-size:14px;color:var(--navy);font-weight:500}
.progress{width:140px;height:2px;background:var(--line);position:relative;border-radius:2px}
.progress i{position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--ink);border-radius:2px;transition:left .2s,width .2s}
.railbtns{display:flex;gap:10px;align-items:center}
.railbtns button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:16px}
.railbtns button:hover{border-color:var(--navy)}
.cities{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:center}
@media(max-width:900px){.cities{grid-template-columns:1fr}}
.cities ul{list-style:none;margin-top:40px}
.cities li button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 0;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;font-size:19px;text-align:left;color:var(--di);transition:color .2s}
.cities li button.on,.cities li button:hover{color:var(--ink)}
.cities .view{aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--navy);position:relative}
.cities .view svg{width:100%;height:100%;display:block}
.cities .view .cap{position:absolute;left:24px;bottom:22px;color:#fff;font-family:var(--serif);font-style:italic;font-size:44px}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.tiers{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.tiers{grid-template-columns:1fr}}
.tier{border:1px solid var(--line);border-radius:var(--r);padding:32px 28px;display:flex;flex-direction:column;background:#fff}
.tier.feat{background:var(--navy);color:#fff;border-color:var(--navy)}
.tier .amt{font-size:46px;font-weight:300;letter-spacing:-.04em;margin:18px 0 2px}
.tier .per{font-size:13.5px;color:var(--mu)}
.tier.feat .per,.tier.feat li,.tier.feat .note{color:var(--onmu)}
.tier .note{font-size:12.5px;color:var(--di);margin-top:4px}
.tier ul{list-style:none;margin:24px 0 30px;flex:1}
.tier li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mu)}
.tier.feat li{border-color:rgba(255,255,255,.14)}
.faq{max-width:900px}
.faq details{border-bottom:1px solid var(--line);padding:24px 0}
.faq summary{cursor:pointer;list-style:none;font-size:21px;display:flex;justify-content:space-between;gap:20px;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-weight:300;font-size:24px;line-height:1;transition:transform .3s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq p{color:var(--mu);margin-top:12px;max-width:680px}
.cta{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.cta .bg{position:absolute;inset:0;opacity:.55}
.cta .bg svg{width:100%;height:100%}
.cta .wrap{position:relative;padding-top:150px;padding-bottom:150px;text-align:center}
.cta h2{font-size:clamp(44px,6vw,92px);max-width:1000px;margin:0 auto 36px}
footer.ft{background:var(--navy);color:#fff;border-top:1px solid rgba(255,255,255,.1)}
footer.ft .wrap{padding-top:80px;padding-bottom:40px}
footer.ft .cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px}
@media(max-width:800px){footer.ft .cols{grid-template-columns:1fr 1fr}}
footer.ft h5{font:500 13px/1 var(--sans);color:var(--onmu);margin-bottom:18px}
footer.ft ul{list-style:none}
footer.ft li{margin-bottom:10px;font-size:14.5px}
footer.ft li a:hover{color:#cdd6ff}
footer.ft .legal{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:70px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px;color:var(--onmu)}
.float{position:fixed;right:22px;bottom:22px;z-index:45;box-shadow:0 12px 30px rgba(11,26,74,.3);opacity:0;pointer-events:none;transform:translateY(10px);transition:.3s var(--ease)}
.float.show{opacity:1;pointer-events:auto;transform:none}
@media(max-width:700px){.float{display:none}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(6,10,26,.55);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:80px 18px}
.modal.on{display:flex}
.modal .box{width:100%;max-width:560px;background:#fff;border-radius:6px;padding:36px;position:relative;animation:pop .3s var(--ease);box-shadow:0 40px 80px rgba(6,10,26,.35)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.modal .x{position:absolute;right:16px;top:14px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--mu);width:36px;height:36px}
.modal h2{font-size:34px;margin-bottom:8px}
.modal .sub{color:var(--mu);font-size:14px;margin-bottom:26px}
.choices{display:grid;gap:10px}
.choices button,.choices a{display:flex;align-items:center;gap:14px;width:100%;padding:15px 18px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;cursor:pointer;font-size:15px;text-align:left}
.choices .primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.choices button:hover,.choices a:hover{border-color:var(--navy)}
.choices .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--mist);color:var(--navy);flex:none}
.choices .primary .ic{background:rgba(255,255,255,.14);color:#fff}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
/* public sub-pages */
.page-hero{background:var(--navy);color:#fff;padding:150px 0 70px;position:relative;overflow:hidden}
.page-hero .bg{position:absolute;inset:0;opacity:.45}
.page-hero .bg svg{width:100%;height:100%}
.page-hero .wrap{position:relative}
.page-hero h1{font-size:clamp(46px,6.4vw,96px)}
.page-hero p{color:#d5dbf0;max-width:520px;margin-top:20px;font-size:16.5px}
.page{padding:70px 0 140px}
.apply{display:grid;grid-template-columns:.75fr 1.25fr;gap:80px;align-items:start}
@media(max-width:950px){.apply{grid-template-columns:1fr;gap:30px}}
.apply .side{position:sticky;top:110px}
@media(max-width:950px){.apply .side{position:static}}
.apply ol{list-style:none;counter-reset:a}
.apply ol li{counter-increment:a;display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);color:var(--mu);font-size:14.5px}
.apply ol li:before{content:"0" counter(a);font-weight:500;color:var(--navy);min-width:26px}
.formcard{border:1px solid var(--line);border-radius:6px;padding:36px;background:#fff}
@media(max-width:600px){.formcard{padding:22px}}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:30px}
.roles button{background:#fff;border:1px solid var(--line2);border-radius:var(--r);padding:14px 8px;cursor:pointer;font-size:13.5px;transition:.2s}
.roles button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(max-width:560px){.roles{grid-template-columns:1fr 1fr}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:600px){.fg{grid-template-columns:1fr}}
.solo{max-width:620px;margin:0 auto;text-align:center}
.solo .mark{width:64px;height:64px;border-radius:50%;background:#e8ecfb;color:var(--navy);display:grid;place-items:center;margin:0 auto 24px;font-size:24px}
.solo h1{font-size:clamp(40px,5vw,64px);margin-bottom:16px}
.legaltext{max-width:780px}
.legaltext h2{font-size:28px;margin:44px 0 12px}
.legaltext p,.legaltext li{color:var(--mu);margin-bottom:10px}
.legaltext ul{padding-left:20px}
/* ================= HUB (members app) ================= */
.hub{display:grid;grid-template-columns:268px 1fr;min-height:100vh;background:var(--mist)}
body.demo .hub{min-height:calc(100vh - 44px)}
.rail-nav{background:var(--navy);color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
body.demo .rail-nav{height:calc(100vh - 44px)}
.rail-nav .logo{margin:0 10px 36px;color:#fff}
.rail-nav .lbl{font:500 10.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--onmu);margin:22px 10px 10px}
.rail-nav a.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r);color:#cfd6ee;font-size:14.5px;margin-bottom:2px;transition:.2s}
.rail-nav a.nv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}
.rail-nav a.nv:hover{background:rgba(255,255,255,.06);color:#fff}
.rail-nav a.nv.on{background:#fff;color:var(--navy)}
